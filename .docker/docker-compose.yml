# Développement : le code est monté, Node redémarre à chaque modification. http://localhost:8890
# La connexion d'essai (DEV_LOGIN) remplace Discord : pas besoin d'application Discord pour travailler.
name: isoloir-dev

services:

  app:
    user: "${UID:-1000}:${GID:-1000}"
    image: node:24-alpine
    container_name: isoloir-dev_app
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec node --disable-warning=ExperimentalWarning --watch server.js"]
    ports:
      - "8890:3000"
    volumes:
      - ..:/app
    env_file:
      - path: ../.env
      - path: ../.env.local
        required: false
    environment:
      NODE_ENV: development
      # DEV_LOGIN=0 make up : la vraie connexion Discord (DISCORD_* dans .env.local).
      DEV_LOGIN: "${DEV_LOGIN:-1}"
      DB_PATH: /app/var/isoloir.db
      BASE_URL: http://localhost:8890
      APP_VERSION: ${APP_VERSION:-dev}
      npm_config_cache: /tmp/npm
